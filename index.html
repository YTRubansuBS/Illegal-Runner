<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illegal Runner</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:white;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}main{width:min(1100px,96vw);padding:24px;box-sizing:border-box}.box{background:#111d30;border:1px solid #29425f;border-radius:20px;padding:30px;box-shadow:0 20px 70px #0008;text-align:center}.logo{font-size:clamp(40px,8vw,86px);font-weight:1000;letter-spacing:3px;color:#45e0ff;text-shadow:0 0 30px #45e0ff66}.sub{color:#a9bad0;font-size:18px}.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:25px}.btn{border:0;border-radius:13px;padding:15px 25px;font-size:17px;font-weight:800;cursor:pointer;background:#45e0ff;color:#06101b}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.secondary{background:#243a55;color:white}.hidden{display:none!important}#gameUI{position:relative;width:100%;height:100%;background:linear-gradient(#102c4a,#08121e);overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.pill{background:#07111dcc;border:1px solid #35516f;border-radius:12px;padding:9px 13px;font-weight:800}.controls{position:absolute;bottom:25px;left:0;right:0;display:flex;justify-content:center;gap:15px}.control{width:min(260px,42vw);height:70px;border:0;border-radius:18px;font-size:20px;font-weight:1000;background:#45e0ffcc;color:#06101b}.dash{background:#ffb83dcc}.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06101bcc}.menu .box{width:min(650px,90vw)}h2{font-size:32px}.small{color:#9fb1c7}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.death{font-size:48px;font-weight:1000;color:#ff657e}.coin{color:#ffd35a}.good{color:#7dffbd}</style></head><body><div id="app"><section id="home"><main><div class="box"><div class="logo">ILLEGAL RUNNER</div><p class="sub">Cours. Plane. Dash. Survis le plus longtemps possible.</p><div class="stats"><span class="pill">♟️ 0 pièces</span><span class="pill">🏆 0 m</span></div><div class="row"><button class="btn" id="start">JOUER</button><button class="btn secondary" id="levels">300 NIVEAUX</button></div><p class="small">Version de secours jouable — la sauvegarde Supabase sera branchée ensuite.</p></div></main></section><section id="gameUI" class="hidden"><canvas id="c"></canvas><div class="hud"><div><span class="pill">📏 <b id="dist">0</b> m</span> <span class="pill">🪙 <b id="coins">0</b></span> <span class="pill">❤️ <b id="lives">1</b></span></div><span class="pill">💨 <b id="dash">PRÊT</b></span></div><div class="controls"><button class="control" id="jump">SAUT / PLANER</button><button class="control dash" id="dashBtn">DASH</button></div><div id="menu" class="menu hidden"><div class="box"><div class="death">RUN TERMINÉE</div><h2><span id="finalDist">0</span> m</h2><p>🪙 Pièces récupérées : <b id="finalCoins">0</b></p><div class="row"><button class="btn" id="replay">REJOUER</button><button class="btn secondary" id="homeBtn">MENU</button></div></div></div></section></div><script>const home=document.getElementById('home'),gameUI=document.getElementById('gameUI'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,raf,last=0,run=false,x=150,y=0,vy=0,ground=0,dist=0,coins=0,lives=1,dashUntil=0,dashReady=0,objects=[],spawn=0,scroll=0,levelMode=false,level=1,jumping=false;function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=H-150;y=ground-55}addEventListener('resize',resize);resize();function startGame(){home.classList.add('hidden');gameUI.classList.remove('hidden');document.getElementById('menu').classList.add('hidden');run=true;dist=0;coins=0;lives=1;objects=[];spawn=0;scroll=0;dashUntil=0;dashReady=performance.now();y=ground-55;vy=0;last=performance.now();raf=requestAnimationFrame(loop)}function jump(){if(!run)return;if(y>=ground-56){vy=-850}else jumping=true}function release(){jumping=false}function dash(){if(!run||performance.now()<dashReady)return;dashUntil=performance.now()+650;dashReady=performance.now()+20000}function spawnObj(){let r=Math.random();if(r<.2)objects.push({type:'coin',x:W+40,y:ground-100-Math.random()*130,s:22});else{let h=35+Math.random()*55;objects.push({type:'obstacle',x:W+40,y:ground-h,w:35+Math.random()*35,h})}}function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function loop(t){if(!run)return;let dt=Math.min(.033,(t-last)/1000);last=t;const speed=430+Math.min(300,dist*.08);const dashing=t<dashUntil;const actual=speed*(dashing?2.2:1);scroll+=actual*dt;dist+=actual*dt/12;spawn-=dt;if(spawn<=0){spawnObj();spawn=.7+Math.random()*.75-Math.min(.35,dist/10000)}vy+=1900*dt;if(jumping&&vy>0)vy+=350*dt;y+=vy*dt;if(y>ground-55){y=ground-55;vy=0}for(let o of objects)o.x-=actual*dt;const player={x:x-18,y:y,w:36,h:55};for(let i=objects.length-1;i>=0;i--){let o=objects[i];if(o.type==='coin'){let q={x:o.x-o.s/2,y:o.y-o.s/2,w:o.s,h:o.s};if(collide(player,q)){coins++;objects.splice(i,1)}}else{let q={x:o.x,y:o.y,w:o.w,h:o.h};if(collide(player,q)){if(dashing&&Number(localStorage.getItem('dashLevel')||1)>=6){objects.splice(i,1)}else{lives--;objects.splice(i,1);if(lives<=0){endGame();return}}}}if(o.x<-100)objects.splice(i,1)}draw(t,dashing);document.getElementById('dist').textContent=Math.floor(dist);document.getElementById('coins').textContent=coins;document.getElementById('lives').textContent=lives;let cd=Math.max(0,(dashReady-t)/1000);document.getElementById('dash').textContent=cd?' '+cd.toFixed(1)+'s':'PRÊT';raf=requestAnimationFrame(loop)}function draw(t,dashing){ctx.clearRect(0,0,W,H);let bg=['#102c4a','#163c2b','#4a2d18','#17183c','#1d1728'][Math.floor(dist/800)%5];ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#182f45';for(let i=-1;i<12;i++){let bx=((i*180-scroll*.18)%1400+1400)%1400;ctx.fillRect(bx,H-280,110,130)}ctx.fillStyle='#0b1825';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#294b62';for(let i=-1;i<30;i++){let bx=((i*70-scroll)%2100+2100)%2100;ctx.fillRect(bx,ground+20,40,5)}for(let o of objects){if(o.type==='coin'){ctx.fillStyle='#ffd35a';ctx.beginPath();ctx.arc(o.x,o.y,o.s/2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8a5c00';ctx.font='bold 16px Arial';ctx.fillText('€',o.x-5,o.y+6)}else{ctx.fillStyle=dashing&&Number(localStorage.getItem('dashLevel')||1)>=6?'#7dffbd':'#ff5570';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill()}}ctx.save();ctx.translate(x,y);if(dashing){ctx.shadowBlur=30;ctx.shadowColor='#45e0ff'}ctx.fillStyle='#45e0ff';ctx.beginPath();ctx.arc(0,15,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#06101b';ctx.fillRect(-14,7,9,5);ctx.fillRect(5,7,9,5);ctx.fillStyle='#45e0ff';ctx.fillRect(-16,35,12,22);ctx.fillRect(4,35,12,22);ctx.restore()}function endGame(){run=false;document.getElementById('finalDist').textContent=Math.floor(dist);document.getElementById('finalCoins').textContent=coins;document.getElementById('menu').classList.remove('hidden')}document.getElementById('start').onclick=()=>startGame();document.getElementById('levels').onclick=()=>{levelMode=true;startGame()};document.getElementById('replay').onclick=startGame;document.getElementById('homeBtn').onclick=()=>{gameUI.classList.add('hidden');home.classList.remove('hidden')};document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};document.getElementById('jump').onpointerup=e=>{e.preventDefault();release()};document.getElementById('jump').onpointercancel=release;document.getElementById('dashBtn').onclick=dash;addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}if(e.code==='ShiftLeft'||e.code==='ShiftRight')dash()});addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')release()});</script></body></html>
