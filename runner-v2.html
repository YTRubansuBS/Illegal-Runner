<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illegal Runner V2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:white;font-family:system-ui}button{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:14px;padding:13px 18px;color:white;background:#112744}.login{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#006c9844,transparent 35%),linear-gradient(135deg,#02050d,#07182e,#180724)}.box{width:min(420px,90vw);padding:28px;border:1px solid #28557f;border-radius:25px;background:#061426ee;box-shadow:0 30px 100px #000}.box h1{font-size:54px;font-style:italic;line-height:.8;margin:0 0 25px}.box h1 span{color:#00e5ff}.box input{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #234b73;background:#040b16;color:white;box-sizing:border-box}.primary{width:100%;background:linear-gradient(135deg,#00e5ff,#246cff);margin-top:8px}.guest{width:100%;margin-top:8px}.err{color:#ff668d;min-height:20px;font-size:13px}.app{height:100%;background:radial-gradient(circle at 50% -10%,#153e6d,#02040a 65%);display:flex;flex-direction:column}.bar{height:64px;display:flex;align-items:center;gap:9px;padding:0 14px;background:#030a16dd;border-bottom:1px solid #1d4268;box-sizing:border-box}.bar b{font-style:italic;font-size:22px}.bar b span{color:#00e5ff}.stats{margin-left:auto}.home{flex:1;overflow:auto;padding:30px}.hero{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center}.hero h2{font-size:80px;line-height:.8;font-style:italic;margin:0}.hero h2 span{color:#00e5ff}.hero p{color:#8da6c7;line-height:1.6}.art{height:350px;border:1px solid #21517f;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(#071a39,#153c4e 58%,#05080e)}.moon{position:absolute;right:50px;top:35px;width:100px;height:100px;border-radius:50%;background:#e8fbff;box-shadow:0 0 70px #5de7ff}.city{position:absolute;bottom:70px;width:100%;height:150px;background:linear-gradient(90deg,#06101e 0 12%,transparent 12% 17%,#0b2139 17% 30%,transparent 30% 34%,#102b45 34% 49%,transparent 49% 55%,#0a1c32 55% 70%,transparent 70% 76%,#0e2944 76% 92%,transparent 92%)}.road{position:absolute;bottom:0;width:100%;height:72px;background:#05080d;border-top:2px solid #00e5ff}.runner{position:absolute;left:30%;bottom:70px;width:65px;height:115px}.runner:before{content:"";position:absolute;left:17px;width:42px;height:42px;border-radius:50%;background:#111827;border:3px solid #00e5ff}.runner:after{content:"";position:absolute;top:42px;width:60px;height:73px;border-radius:18px;background:linear-gradient(145deg,#14376c,#00dfff);box-shadow:0 0 25px #00bfff}.menu{max-width:1100px;margin:25px auto;display:flex;gap:10px;flex-wrap:wrap}.menu button{flex:1;min-width:180px}.game{position:fixed;inset:0;background:#02040a;z-index:20}.game canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:0;left:0;right:0;height:70px;z-index:2;display:flex;align-items:center;gap:8px;padding:10px;background:linear-gradient(#020711ee,#02071144,transparent);pointer-events:none;box-sizing:border-box}.hud>*{pointer-events:auto}.hud .right{margin-left:auto;display:flex;gap:7px}.hearts{color:#ff4168;font-size:20px}.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:3;pointer-events:none}.controls button{pointer-events:auto;min-width:140px}.jump{background:linear-gradient(135deg,#00e5ff,#246cff)}.dash{background:linear-gradient(135deg,#a14dff,#ff3e91)}.overlay{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:#02050ccc}.over{width:min(500px,90vw);padding:28px;text-align:center;border:1px solid #28557f;border-radius:24px;background:#07172a;box-shadow:0 30px 100px #000}.over h2{font-size:45px;margin:5px}.results{display:flex;gap:8px}.results div{flex:1;padding:15px;border:1px solid #21476e;border-radius:12px}.results b{display:block;font-size:26px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#091b30;border:1px solid #2b6595;padding:10px 16px;border-radius:12px;opacity:0;z-index:50}.toast.show{opacity:1}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero h2{font-size:60px}.art{height:250px}.home{padding:15px}}</style></head><body>
<div id="login" class="login"><div class="box"><h1>ILLEGAL<br><span>RUNNER</span></h1><p>Connexion Supabase</p><input id="name" placeholder="Pseudo" maxlength="20"><input id="pass" type="password" placeholder="Mot de passe" minlength="6"><button class="primary" onclick="login(false)">SE CONNECTER</button><button class="primary" onclick="login(true)">CRÉER LE COMPTE</button><button class="guest" onclick="guest()">JOUER EN LOCAL</button><div id="err" class="err"></div></div></div>
<div id="app" class="app" style="display:none"><div class="bar"><b>ILLEGAL <span>RUNNER</span></b><div class="stats">🪙 <span id="coins">0</span> • 🏆 <span id="best">0</span>m</div><button onclick="logout()">↪</button></div><div class="home"><div class="hero"><div><small style="color:#65ebff;letter-spacing:3px;font-weight:900">RUSH THE LIMIT</small><h2>RUN<br><span>FURTHER.</span></h2><p>Un runner plus nerveux : vitesse dynamique, vrais obstacles, pièces, bonus, vies et dash avec cooldown de 20 secondes.</p><div class="menu"><button onclick="start(0)">▶ INFINI</button><button onclick="start(1)">🏁 NIVEAU 1</button><button onclick="start(10)">🏁 NIVEAU 10</button></div></div><div class="art"><div class="moon"></div><div class="city"></div><div class="runner"></div><div class="road"></div></div></div></div></div>
<div id="game" class="game" style="display:none"><canvas id="c"></canvas><div class="hud"><button onclick="quit()">← MENU</button><div class="hearts" id="hearts">♥</div><b id="objective">INFINI</b><div class="right"><span>📏 <span id="dist">0</span>m</span><span>🪙 <span id="runCoins">0</span></span><span id="dashText">⚡ PRÊT</span></div></div><div class="controls"><button class="jump" id="jump">⬆ SAUT / PLANER</button><button class="dash" onclick="doDash()">⚡ DASH</button></div><div id="over" class="overlay"><div class="over"><div>RUN TERMINÉ</div><h2 id="overTitle">TU ES MORT</h2><div class="results"><div>📏<b id="finalDist">0</b></div><div>🪙<b id="finalCoins">0</b></div><div>⏱️<b id="finalTime">0</b></div></div><button class="primary" onclick="restart()">↻ REJOUER</button><button onclick="quit()">MENU</button></div></div></div><div id="toast" class="toast"></div>
<script>
const CFG=window.IR_CONFIG||{};const URL=CFG.SUPABASE_URL||'YOUR_SUPABASE_URL';const KEY=CFG.SUPABASE_ANON_KEY||'YOUR_SUPABASE_ANON_KEY';const sb=window.supabase&&URL.startsWith('http')&&!KEY.startsWith('YOUR_')?window.supabase.createClient(URL,KEY):null;let user=null,profile=null,isGuest=false;const $=x=>document.getElementById(x);const base={username:'Invité',coins:0,best_distance:0,total_distance:0,highest_level:1,lives_level:1,distance_level:1,dash_level:1,jump_level:1,coin_level:1,bonus_level:1};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}function email(n){return n.toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@illegal-runner.local'}async function login(create){if(!sb){$('err').textContent='Remplace les variables Supabase dans config.js.';return}try{let n=$('name').value.trim(),p=$('pass').value,r=create?await sb.auth.signUp({email:email(n),password:p,options:{data:{username:n}}}):await sb.auth.signInWithPassword({email:email(n),password:p});if(r.error)throw r.error;if(create&&!r.data.session)throw new Error('Désactive Email Confirmations dans Supabase.');user=r.data.user;let q=await sb.from('profiles').select('*').eq('id',user.id).single();if(q.error)throw q.error;profile=q.data;show()}catch(e){$('err').textContent=e.message}}function guest(){isGuest=true;profile=JSON.parse(localStorage.getItem('irGuest')||JSON.stringify(base));show()}function show(){$('login').style.display='none';$('app').style.display='flex';$('coins').textContent=profile.coins||0;$('best').textContent=profile.best_distance||0}async function logout(){if(sb&&!isGuest)await sb.auth.signOut();location.reload()}
let ctx,W,H,dpr=1,raf,run=false,level=0,dist=0,coins=0,lives=1,spd=380,spawn=0,coinSpawn=0,dash=0,dashReady=true,gliding=false,last=0,player,obs=[],cs=[],parts=[];function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);$('c').width=W*dpr;$('c').height=H*dpr}function start(l){level=l;$('app').style.display='none';$('game').style.display='block';ctx=$('c').getContext('2d');resize();dist=0;coins=0;spd=380+(profile.distance_level||1)*18;spawn=.8;coinSpawn=.5;dash=0;dashReady=true;obs=[];cs=[];parts=[];lives=profile.lives_level||1;player={x:Math.max(90,W*.2),y:H*.45,vy:0,w:45,h:65,ground:false,run:0,inv:0,shield:false};$('objective').textContent=l?'NIVEAU '+l:'INFINI';$('over').style.display='none';drawHearts();let n=3;$('dashText').textContent=n;let t=setInterval(()=>{n--;if(n<=0){clearInterval(t);$('dashText').textContent='⚡ PRÊT';run=true;last=performance.now();raf=requestAnimationFrame(loop)}else $('dashText').textContent=n},500)}function drawHearts(){$('hearts').textContent='♥ '.repeat(lives)||'♡'}function jump(){if(!run)return;if(player.ground){player.vy=-900-(profile.jump_level||1)*50;player.ground=false}gliding=true}function release(){gliding=false}function doDash(){if(!run||!dashReady)return;dashReady=false;dash=20;player.shield=(profile.dash_level||1)>=6;toast('⚡ DASH !')}$('jump').onpointerdown=e=>{e.preventDefault();jump()};$('jump').onpointerup=release;$('jump').onpointercancel=release;window.onkeydown=e=>{if(e.code==='Space'||e.code==='ArrowUp')jump();if(e.code.startsWith('Shift'))doDash()};window.onkeyup=e=>{if(e.code==='Space'||e.code==='ArrowUp')release()};function loop(t){if(!run)return;let dt=Math.min(.03,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}function update(dt){dist+=spd*dt*.065;spd=Math.min(760,380+(profile.distance_level||1)*18+dist*.018+(dash>0?520:0));if(dash>0){dash-=dt;if(dash<=0){dash=0;dashReady=true;player.shield=(profile.dash_level||1)>=6}}$('dashText').textContent=dash>0?'⚡ '+Math.ceil(dash)+'s':dashReady?'⚡ PRÊT':'⚡ CHARGE';spawn-=dt;coinSpawn-=dt;if(spawn<=0){spawnObs();spawn=Math.max(.5,1.1-dist/9000-Math.random()*.2)}if(coinSpawn<=0){for(let i=0;i<5;i++)cs.push({x:W+60+i*38,y:H*.4+Math.random()*H*.25-Math.sin(i/4*Math.PI)*45,r:10});coinSpawn=1.2+Math.random()*.7}const g=H-120;player.vy+=2300*dt;if(gliding&&player.vy>80)player.vy*=Math.pow(.25,dt);player.y+=player.vy*dt;if(player.y+player.h>=g){player.y=g-player.h;player.vy=0;player.ground=true}else player.ground=false;obs.forEach(o=>o.x-=spd*dt);cs.forEach(c=>c.x-=spd*dt);for(let o of obs)if(hit(o)){if(player.shield)o.dead=true;else return hurt()}obs=obs.filter(o=>o.x>-150&&!o.dead);cs=cs.filter(c=>c.x>-50&&!c.got);for(let c of cs)if(circle(c)){c.got=true;coins+=(profile.coin_level||1)}if(player.y>H+100)hurt();$('dist').textContent=Math.floor(dist);$('runCoins').textContent=coins;if(level&&dist>=420+level*19)return finish()}function spawnObs(){let g=H-120,x=W+80,r=Math.random();if(r<.2)obs.push({t:'spike',x,y:g-45,w:48,h:45});else if(r<.4)obs.push({t:'wall',x,y:g-90,w:48,h:90});else if(r<.58)obs.push({t:'car',x,y:g-40,w:90,h:40});else if(r<.75)obs.push({t:'fly',x,y:H*.25+Math.random()*H*.35,w:55,h:32});else obs.push({t:'gap',x,y:g,w:120,h:30})}function hit(o){if(o.t==='gap')return player.ground&&player.x+player.w>o.x&&player.x<o.x+o.w;return player.x+7<o.x+o.w&&player.x+player.w-7>o.x&&player.y+7<o.y+o.h&&player.y+player.h-5>o.y}function circle(c){let x=Math.max(player.x,Math.min(c.x,player.x+player.w)),y=Math.max(player.y,Math.min(c.y,player.y+player.h));return(x-c.x)**2+(y-c.y)**2<c.r*c.r}function hurt(){if(player.inv>0)return;player.inv=1.2;lives--;drawHearts();if(lives<=0)end();else{player.y=H*.3;player.vy=-650;obs=[];toast('❤️ VIE PERDUE')}}async function saveRun(levelRun){let d=Math.floor(dist),c=coins,s=Math.floor(performance.now()/1000);if(isGuest){profile.coins=(profile.coins||0)+c;profile.best_distance=Math.max(profile.best_distance||0,d);profile.total_distance=(profile.total_distance||0)+d;if(levelRun)profile.highest_level=Math.max(profile.highest_level,level+1);localStorage.setItem('irGuest',JSON.stringify(profile))}else{let r=await sb.rpc('finish_run',{p_mode:levelRun?'level':'infinite',p_level:levelRun?level:0,p_distance:d,p_coins:c,p_seconds:s});if(r.error)toast('Sauvegarde impossible');profile.coins=(profile.coins||0)+c;profile.best_distance=Math.max(profile.best_distance||0,d);profile.total_distance=(profile.total_distance||0)+d;if(levelRun)profile.highest_level=Math.max(profile.highest_level,level+1);await sb.from('profiles').update({coins:profile.coins,best_distance:profile.best_distance,total_distance:profile.total_distance,highest_level:profile.highest_level}).eq('id',user.id)}show()}async function end(){if(!run)return;run=false;cancelAnimationFrame(raf);await saveRun(false);results('TU ES MORT')}async function finish(){if(!run)return;run=false;cancelAnimationFrame(raf);await saveRun(true);results(level===300?'🏆 CHAMPION !':'🏁 ARRIVÉE !')}function results(title){$('overTitle').textContent=title;$('finalDist').textContent=Math.floor(dist)+'m';$('finalCoins').textContent=coins;$('finalTime').textContent=Math.floor(performance.now()/1000);$('over').style.display='grid'}function restart(){$('over').style.display='none';start(level)}function quit(){run=false;cancelAnimationFrame(raf);$('game').style.display='none';$('app').style.display='flex';show()}function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);let gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#07172f');gr.addColorStop(1,'#0a3952');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);let g=H-120;ctx.fillStyle='#07121d';ctx.fillRect(0,g,W,H-g);ctx.strokeStyle='#00e5ff';ctx.strokeRect(0,g,W,1);for(let x=-(dist*15%150);x<W;x+=150){ctx.fillStyle='#d8fbff55';ctx.fillRect(x,g+42,70,4)}for(let i=0;i<45;i++){ctx.fillStyle='#dffaff55';ctx.fillRect((i*173-dist*2)%W,(i*79)%(H*.55),2,2)}for(let c of cs){ctx.fillStyle='#ffc928';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.fill()}for(let o of obs){ctx.fillStyle=o.t==='car'?'#ff3e63':o.t==='fly'?'#a14dff':'#d7efff';if(o.t==='spike'){ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill()}else if(o.t==='gap'){ctx.fillStyle='#010205';ctx.fillRect(o.x,o.y,o.w,H-o.y)}else ctx.fillRect(o.x,o.y,o.w,o.h)}ctx.save();ctx.translate(player.x,player.y);if(player.inv>0&&Math.floor(player.inv*10)%2)ctx.globalAlpha=.35;if(player.shield){ctx.strokeStyle='#00e5ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(23,32,50,0,7);ctx.stroke()}ctx.fillStyle='#111827';ctx.strokeStyle='#00e5ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(29,18,19,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#0b5bb0';ctx.beginPath();ctx.roundRect(6,36,48,30,12);ctx.fill();ctx.fillStyle='#00e5ff';ctx.fillRect(13,44,30,5);let a=Math.sin(player.run*5)*9;ctx.strokeStyle='#0b5bb0';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(18,65);ctx.lineTo(8+a,78);ctx.moveTo(42,65);ctx.lineTo(52-a,78);ctx.stroke();ctx.restore()}window.onresize=()=>{if(canvas)resize()};
(async()=>{if(sb){let r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;let q=await sb.from('profiles').select('*').eq('id',user.id).single();if(!q.error){profile=q.data;show()}}}})();</script></body></html>
